# LEADER=keyboard: the browser sends held keys; the official node integrates
# hand poses and the existing IK converts them to joint targets.
# See leader-ker.yaml for the common module inputs and outputs.
module:
  name: leader-keyboard
  inputs:
    - tick
    - camera_head_left
    - camera_head_right
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata

nodes:
  - id: keyboard
    path: ../scripts/model-node
    args: "dora-openarm-keyboard"
    env:
      OPENARM_MODEL: "${OPENARM_MODEL:-}"
      ROBOT: "${ROBOT:-dummy}"
      OPENARM_MODEL_REPORT_DIR: "${OPENARM_MODEL_REPORT_DIR:-}"
    inputs:
      # Keep-alive only: Keyboard publishes at its own pace, not this tick rate.
      # No camera input is needed for keyboard control over an SSH tunnel.
      tick: _mod/tick
    outputs:
      - pose_right
      - pose_left
      - command
      - status

  - id: ik
    path: ../scripts/model-node
    args: >-
      dora-openarm-ik
      --mode bimanual --tick-hz 500
      --max-iters 5 --damping 0.1
      --posture-cost 0 --lm-damping 0.01 --limit-velocity
    env:
      OPENARM_MODEL: "${OPENARM_MODEL:-}"
      ROBOT: "${ROBOT:-dummy}"
      OPENARM_MODEL_REPORT_DIR: "${OPENARM_MODEL_REPORT_DIR:-}"
    inputs:
      target_right: keyboard/pose_right
      target_left: keyboard/pose_left
    outputs:
      - position_right
      - position_left
      - status

  - id: out
    path: ../dora-echo
    inputs:
      follower_position_right: ik/position_right
      follower_position_left: ik/position_left
    outputs:
      - follower_position_right
      - follower_position_left
      # Not sent by Keyboard. Quit through the collection UI for now; routing
      # keyboard/command (Esc) into whole-dataflow shutdown is tracked in #6.
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - vr_receive_times
      - ker_position
      - metadata
